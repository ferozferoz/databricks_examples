# This is a Declarative Automation Bundle definition for Dabs.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: Dabs
  uuid: 7fa14858-fc0c-40b3-adbd-38f2143cd012

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-f03d9596-65d1.cloud.databricks.com
    variables:
      catalog: databricks_example
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-f03d9596-65d1.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/ambreen.nasir178@outlook.com to make sure we only have a single copy.
      root_path: /Workspace/Users/ambreen.nasir178@outlook.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: databricks_example
      schema: prod
    permissions:
      - user_name: ambreen.nasir178@outlook.com
        level: CAN_MANAGE
