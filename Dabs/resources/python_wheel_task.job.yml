# job to run only python_wheel_task

resources:
  jobs:     
    python_wheel_task_job:
      name: python_wheel_task

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:        
        - task_key: main_task
          environment_key: default         
          python_wheel_task:
            package_name: Dabs
            entry_point: main
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.schema}"
        - task_key: main_1_task
          depends_on:
            - task_key: main_task          
          python_wheel_task:
            package_name: Dabs
            entry_point: main_1
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.schema}"
              
          environment_key: default     

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              # By default we just include the .whl file generated for the Dabs package.
              # See https://docs.databricks.com/dev-tools/bundles/library-dependencies.html
              # for more information on how to add other libraries.
              - ../dist/*.whl
    
