# A job to read data from S3 / DBFS datasets and write to Delta tables.

resources:
  jobs:
    read_s3_job:
      name: read_s3_job

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: dataset_name
          default: online_retail
        - name: run_id
          default: data-001
        - name: partition_by
          default: cobdate

      tasks:
        - task_key: read_s3_task
          notebook_task:
            notebook_path: ../src/read_s3.ipynb