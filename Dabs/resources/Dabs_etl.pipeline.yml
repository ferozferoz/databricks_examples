# The main pipeline for Dabs

resources:
  pipelines:
    Dabs_etl:
      name: Dabs_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/Dabs_etl"

      libraries:
        - glob:
            include: ../src/Dabs_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
